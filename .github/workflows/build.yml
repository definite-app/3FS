name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This fork has no self-hosted runners. Upstream's self-hosted pool is
    # private, so jobs there sit in action_required. Use GitHub-hosted 22.04
    # to match the documented toolchain (clang-14, gcc-12, libprocps-dev).
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
          /usr/share/swift
        df -h

    - name: Configure sccache-cache
      run: |
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.4

    - name: Prepare
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          cmake ninja-build meson pkg-config wget \
          libuv1-dev liblz4-dev liblzma-dev libdouble-conversion-dev \
          libprocps-dev libdwarf-dev libunwind-dev libaio-dev \
          libgflags-dev libgoogle-glog-dev libgtest-dev libgmock-dev \
          clang-format-14 clang-14 clang-tidy-14 lld-14 \
          libgoogle-perftools-dev google-perftools libssl-dev ccache \
          gcc-12 g++-12 libboost-all-dev rustc cargo \
          libibverbs-dev libnuma-dev python3-dev
        wget -q https://github.com/apple/foundationdb/releases/download/7.1.61/foundationdb-clients_7.1.61-1_amd64.deb
        sudo dpkg -i foundationdb-clients_7.1.61-1_amd64.deb
        git clone https://github.com/libfuse/libfuse.git libfuse -b fuse-3.16.2 --depth 1
        cmake -E make_directory libfuse/build
        meson setup libfuse/build libfuse
        ninja -C libfuse/build
        sudo ninja -C libfuse/build install
        rm -rf libfuse
        git submodule update --init --recursive
        ./patches/apply.sh

    - name: Build
      run: |
        cargo build --release
        cmake -S . -B build \
          -DCMAKE_CXX_COMPILER=clang++-14 \
          -DCMAKE_C_COMPILER=clang-14 \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        cmake --build build -j "$(nproc)"
